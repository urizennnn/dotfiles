# General Settings
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set-window-option -g mode-keys vi

# Key Bindings
unbind C-b
set -g pre***REMOVED***x C-Space
bind C-Space send-pre***REMOVED***x
bind '***REMOVED***' split-window -v -c ***REMOVED***#{pane_current_path}***REMOVED***
bind % split-window -h -c ***REMOVED***#{pane_current_path}***REMOVED***
bind-key -n C-v split-window -v -c ***REMOVED***#{pane_current_path}***REMOVED***
bind-key -n C-s split-window -h -c ***REMOVED***#{pane_current_path}***REMOVED***

# Copy Mode (vi) Key Bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X copy-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Status Line
set -g status-right 'Continuum status: #{continuum_status}'
set -g status-right '#(gitmux ***REMOVED***#{pane_current_path}***REMOVED***)'

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tpm'

# Plugin Con***REMOVED***guration
## Catppuccin
set -g @catppuccin_flavor ***REMOVED***macchiato***REMOVED***
set -g @catppuccin_status_background ***REMOVED***none***REMOVED***
set -g @catppuccin_window_status_style ***REMOVED***none***REMOVED***
set -g @catppuccin_pane_status_enabled ***REMOVED***off***REMOVED***
set -g @catppuccin_pane_border_status ***REMOVED***off***REMOVED***

## Online Status
set -g @online_icon ***REMOVED***ok***REMOVED***
set -g @offline_icon ***REMOVED***nok***REMOVED***

## Continuum
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1' # Save every 15 minutes

## Resurrect
set -g @resurrect-auto-save 'on'
set -g @resurrect-auto-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# If resurrect restore fails, start a new tmux session
set -g @resurrect-hook-post-restore ***REMOVED***if [ -z \***REMOVED***$(tmux list-sessions)\***REMOVED*** ]; then tmux new-session; ***REMOVED******REMOVED***


set -g @resurrect-debug 'on'
# Status Left Look and Feel
# status left style
set -g status-left-length 100
set -g status-left ***REMOVED******REMOVED***
set -ga status-left ***REMOVED***#{?client_pre***REMOVED***x,#{#[bg=#{@thm_red},fg=#{@thm_mantle},bold]  #S },#{#[bg=#{@thm_mantle},fg=#{@thm_green}]  #S }}***REMOVED***
set -ga status-left ***REMOVED***#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│***REMOVED***
set -ga status-left ***REMOVED***#[bg=#{@thm_mantle},fg=#{@thm_maroon}]  #{pane_current_command} ***REMOVED***
set -ga status-left ***REMOVED***#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│***REMOVED***
set -ga status-left ***REMOVED***#[bg=#{@thm_mantle},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} ***REMOVED***

# Con***REMOVED***gure Online
set -g @online_icon ***REMOVED***ok***REMOVED***
set -g @offline_icon ***REMOVED***nok***REMOVED***

# status right style
set -g status-right-length 100
set -g status-right ***REMOVED******REMOVED***
set -ga status-right ***REMOVED***#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_mantle}]},#{#[bg=#{@thm_mantle},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} ***REMOVED***
set -ga status-right ***REMOVED***#[bg=#{@thm_mantle},fg=#{@thm_overlay_0}, none]│***REMOVED***
set -ga status-right ***REMOVED***#[bg=#{@thm_mantle}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }***REMOVED***
set -ga status-right ***REMOVED***#[bg=#{@thm_mantle},fg=#{@thm_overlay_0}, none]│***REMOVED***
set -ga status-right ***REMOVED***#[bg=#{@thm_mantle},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M ***REMOVED***

# window style
set -wg automatic-rename on
set -g automatic-rename-format ''
set -g window-status-separator '|'
set -g status-justify 'absolute-centre'
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_flags ***REMOVED***icon***REMOVED***
set -g @catppuccin_window_number ***REMOVED******REMOVED***
set -g @catppuccin_window_text ***REMOVED***#[fg=#{@thm_rosewater},bg=#{@thm_mantle}] #I#{?#{!=:#{window_name},},: #W,}***REMOVED***
set -g @catppuccin_window_current_number ***REMOVED******REMOVED***
set -g @catppuccin_window_current_text ***REMOVED***#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I#{?#{!=:#{window_name},},: #W,}***REMOVED***
# Bootstrap TPM
if ***REMOVED***test ! -d ~/.tmux/plugins/tpm***REMOVED*** \
   ***REMOVED***run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'***REMOVED***

# Initialize Plugins (keep this line at the very bottom of tmux.conf)
run ~/.con***REMOVED***g/tmux/plugins/catppuccin/tmux/catppuccin.tmux
