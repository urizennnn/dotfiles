# General Settings
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set-window-option -g mode-keys vi

# Key Bindings
unbind C-b
set -g pre***REMOVED***x C-Space
bind C-Space send-pre***REMOVED***x
bind '***REMOVED***' split-window -v -c ***REMOVED***#{pane_current_path}***REMOVED***
bind % split-window -h -c ***REMOVED***#{pane_current_path}***REMOVED***
bind-key -n C-v split-window -v -c ***REMOVED***#{pane_current_path}***REMOVED***
bind-key -n C-s split-window -h -c ***REMOVED***#{pane_current_path}***REMOVED***

# Copy Mode (vi) Key Bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X copy-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Status Line
set -g status-right 'Continuum status: #{continuum_status}'
set -g status-right '#(gitmux ***REMOVED***#{pane_current_path}***REMOVED***)'

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tpm'

# Plugin Con***REMOVED***guration
## Catppuccin
set -g @catppuccin_flavor ***REMOVED***macchiato***REMOVED***
set -g @catppuccin_status_background ***REMOVED***none***REMOVED***
set -g @catppuccin_window_status_style ***REMOVED***none***REMOVED***
set -g @catppuccin_pane_status_enabled ***REMOVED***off***REMOVED***
set -g @catppuccin_pane_border_status ***REMOVED***off***REMOVED***

## Online Status
set -g @online_icon ***REMOVED***ok***REMOVED***
set -g @offline_icon ***REMOVED***nok***REMOVED***

## Continuum
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1' # Save every 15 minutes

## Resurrect
set -g @resurrect-auto-save 'on'
set -g @resurrect-auto-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Status Left Look and Feel
set -g status-left-length 100
set -g status-left ***REMOVED******REMOVED***
set -ga status-left ***REMOVED***#{?client_pre***REMOVED***x,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}***REMOVED***
set -ga status-left ***REMOVED***#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│***REMOVED***
set -ga status-left ***REMOVED***#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} ***REMOVED***
set -ga status-left ***REMOVED***#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│***REMOVED***
set -ga status-left ***REMOVED***#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} ***REMOVED***
set -ga status-left ***REMOVED***#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}***REMOVED***
set -ga status-left ***REMOVED***#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}***REMOVED***

# Status Right Look and Feel
set -g status-right-length 100
set -g status-right ***REMOVED******REMOVED***
set -ga status-right ***REMOVED***#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} ***REMOVED***
set -ga status-right ***REMOVED***#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│***REMOVED***
set -ga status-right ***REMOVED***#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }***REMOVED***
