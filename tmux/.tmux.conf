# General Settings
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set-window-option -g mode-keys vi

# Truecolor/TERM (broadly compatible)
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*:Tc"

# Key Bindings
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind-key -n C-v split-window -v -c "#{pane_current_path}"
bind-key -n C-s split-window -h -c "#{pane_current_path}"

# Copy Mode (vi) Key Bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X copy-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Status Line
set -g status-right 'Continuum status: #{continuum_status}'
set -g status-right '#(gitmux "#{pane_current_path}")'

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tpm'

# Plugin Configuration
## Catppuccin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

## Online Status
set -g @online_icon "ok"
set -g @offline_icon "nok"

## Continuum
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1' # Save every 15 minutes

## Resurrect
set -g @resurrect-auto-save 'on'
set -g @resurrect-auto-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# If resurrect restore fails, start a new tmux session
set -g @resurrect-hook-post-restore "if [ -z \"$(tmux list-sessions)\" ]; then tmux new-session; fi"

set -g @resurrect-debug 'on'

# Status Left Look and Feel
# status left style
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_mantle},bold]  #S },#{#[bg=#{@thm_mantle},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status right style
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_mantle}]},#{#[bg=#{@thm_mantle},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_mantle}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# window style
set -wg automatic-rename on
set -g automatic-rename-format ''
set -g window-status-separator '|'
set -g status-justify 'absolute-centre'
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_number ""
set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=#{@thm_mantle}] #I#{?#{!=:#{window_name},},: #W,}"
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I#{?#{!=:#{window_name},},: #W,}"

# Bootstrap TPM (theme init happens here)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
run '~/.tmux/plugins/tpm/tpm'

##### ——— Overrides that must come AFTER plugin/theme init ——— #####

# 1) Sessions list – quick access
#    - Native chooser and a popup variant. choose-tree -s lists sessions.
bind-key s choose-tree -Zs                 # sessions tree (full-screen). :contentReference[oaicite:1]{index=1}
bind-key -n M-s display-popup -E "tmux choose-tree -Zs"  # popup session picker. :contentReference[oaicite:2]{index=2}

# 2) Pane border: make it blend with the background (the “mystery line”).
#    Keep the status OFF so it doesn't claim an extra row.
set -g pane-border-status off              # no labels on the border. :contentReference[oaicite:3]{index=3}
set -g pane-border-style "fg=default,bg=default"        # inactive border. :contentReference[oaicite:4]{index=4}
set -g pane-active-border-style "fg=default,bg=default" # active border. :contentReference[oaicite:5]{index=5}
