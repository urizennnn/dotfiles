# Pane Border Look and Feel
setw -g pane-border-status top
setw -g pane-border-format ***REMOVED******REMOVED***
setw -g pane-active-border-style ***REMOVED***bg=#{@thm_bg},fg=#{@thm_overlay_0}***REMOVED***
setw -g pane-border-style ***REMOVED***bg=#{@thm_bg},fg=#{@thm_surface_0}***REMOVED***
setw -g pane-border-lines single

# Window Look and Feel
set -wg automatic-rename on
set -g automatic-rename-format ***REMOVED***Window***REMOVED***
set -g window-status-format ***REMOVED*** #I#{?#{!=:#{window_name},Window},: #W,} ***REMOVED***
set -g window-status-style ***REMOVED***bg=#{@thm_bg},fg=#{@thm_rosewater}***REMOVED***
set -g window-status-last-style ***REMOVED***bg=#{@thm_bg},fg=#{@thm_peach}***REMOVED***
