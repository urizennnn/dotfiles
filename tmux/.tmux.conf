set -g window-status-bell-style ***REMOVED***bg=#{@thm_red},fg=#{@thm_bg},bold***REMOVED***
set -gF window-status-separator ***REMOVED***#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│***REMOVED***
set -g window-status-current-format ***REMOVED*** #I#{?#{!=:#{window_name},Window},: #W,} ***REMOVED***
set -g window-status-current-style ***REMOVED***bg=#{@thm_peach},fg=#{@thm_bg},bold***REMOVED***

# Con***REMOVED***gure Tmux Look and Feel
set -g status-position top
set -g status-style ***REMOVED***bg=#{@thm_bg}***REMOVED***
set -g status-justify ***REMOVED***absolute-centre***REMOVED***

# Bootstrap TPM
if ***REMOVED***test ! -d ~/.tmux/plugins/tpm***REMOVED*** \
   ***REMOVED***run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'***REMOVED***

